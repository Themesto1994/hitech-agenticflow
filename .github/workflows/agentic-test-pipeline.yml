name: Agentic Test Pipeline
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  One loop, from requirement to proof  (TestMu AI Assurance)             ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# Required secrets:
#   KANE_USERNAME / KANE_ACCESS_KEY  — TestMu credentials
#   LT_USERNAME   / LT_ACCESS_KEY   — LambdaTest credentials
 
on:
  workflow_dispatch:
    inputs:
      requirements_doc:
        description: "Path to requirements PDF/DOCX (blank = auto-detect in repo root)"
        required: false
        default: ""
      test_language:
        description: "Language for exported automation code"
        required: false
        default: "javascript"
        type: choice
        options:
          - javascript
          - python
      max_tests_to_run:
        description: "Max tests to author and run (0 = all)"
        required: false
        default: 0
        type: number
      start_url:
        description: "Default start URL for test execution (e.g. https://twilio.com)"
        required: false
        default: ""
      kane_project_id:
        description: "LambdaTest project ID (blank = account default)"
        required: false
        default: ""
      kane_folder_id:
        description: "LambdaTest folder ID (blank = account default)"
        required: false
        default: ""
  push:
    branches: [ main, master ]
    paths:
      - "*.pdf"
      - "*.docx"
  workflow_call:
    inputs:
      requirements_doc:
        type: string
        required: false
        default: ""
      test_language:
        type: string
        required: false
        default: "javascript"
      max_tests_to_run:
        type: number
        required: false
        default: 0
      start_url:
        type: string
        required: false
        default: ""
      kane_project_id:
        type: string
        required: false
        default: ""
      kane_folder_id:
        type: string
        required: false
        default: ""
    secrets:
      KANE_USERNAME:
        required: true
      KANE_ACCESS_KEY:
        required: true
      LT_USERNAME:
        required: true
      LT_ACCESS_KEY:
        required: true
 
jobs:
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 1 — CONTEXT
  # ══════════════════════════════════════════════════════════════════════════
  context:
    name: "Phase 1 — Context: Ingest the PRD"
    runs-on: ubuntu-latest
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: "📋 Phase 1 overview"
        run: |
          echo -e "\033[1;36m╔══════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;36m║           PHASE 1 — CONTEXT : Ingest the PRD            ║\033[0m"
          echo -e "\033[1;36m╠══════════════════════════════════════════════════════════╣\033[0m"
          echo -e "\033[0;37m  • Installs kane-cli and registers the AI skill           \033[0m"
          echo -e "\033[0;37m  • Logs in and sets project / folder workspace            \033[0m"
          echo -e "\033[0;37m  • Ingests the requirements doc (PDF/DOCX) → .context/   \033[0m"
          echo -e "\033[0;37m  • AI agent extracts use-cases with source citations      \033[0m"
          echo -e "\033[0;37m  • Auto-approves all use-cases for CI mode                \033[0m"
          echo -e "\033[0;37m  • Uploads context store artifact for downstream phases   \033[0m"
          echo -e "\033[1;36m╚══════════════════════════════════════════════════════════╝\033[0m"
 
      - name: Cache npm (avoids re-downloading kane-cli on every fresh runner)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-kane-cli
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Update kane-cli skill
        run: kane-cli install skill || true
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "$KANE_PROJECT_ID" ] && args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && args+=(--folder-id  "$KANE_FOLDER_ID")
          kane-cli login "${args[@]}"
 
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID" || true
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"  || true
 
      - name: "🔍 Show active project and folder"
        run: |
          echo "=== Resolving project and folder names ==="
 
          if [ -n "$KANE_PROJECT_ID" ]; then
            PROJECT_NAME=$(
              kane-cli project list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_PROJECT_ID\" or .projectId == \"$KANE_PROJECT_ID\") | .name // .projectName // .title" 2>/dev/null \
              || kane-cli project list 2>/dev/null | grep -i "$KANE_PROJECT_ID" | head -n1 \
              || echo ""
            )
            if [ -n "$PROJECT_NAME" ]; then
              echo "  Project : $PROJECT_NAME  (id: $KANE_PROJECT_ID)"
            else
              echo "  Project ID : $KANE_PROJECT_ID  (name not resolved — check kane-cli project list)"
            fi
          else
            echo "  Project : <account default> (no ID provided)"
          fi
 
          if [ -n "$KANE_FOLDER_ID" ]; then
            FOLDER_NAME=$(
              kane-cli folder list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_FOLDER_ID\" or .folderId == \"$KANE_FOLDER_ID\") | .name // .folderName // .title" 2>/dev/null \
              || kane-cli folder list 2>/dev/null | grep -i "$KANE_FOLDER_ID" | head -n1 \
              || echo ""
            )
            if [ -n "$FOLDER_NAME" ]; then
              echo "  Folder  : $FOLDER_NAME  (id: $KANE_FOLDER_ID)"
            else
              echo "  Folder ID : $KANE_FOLDER_ID  (name not resolved — check kane-cli folder list)"
            fi
          else
            echo "  Folder  : <account default> (no ID provided)"
          fi
 
      - name: Resolve requirements document
        id: resolve
        run: |
          doc="${{ inputs.requirements_doc }}"
          if [ -z "$doc" ]; then
            doc=$(find . -maxdepth 2 \( -iname '*.pdf' -o -iname '*.docx' \) | head -n1)
          fi
          [ -z "$doc" ]   && { echo "::error::No requirements doc found."; exit 1; }
          [ ! -f "$doc" ] && { echo "::error::'$doc' not found in repo.";  exit 1; }
          echo "doc=$doc" >> "$GITHUB_OUTPUT"
          echo "Using: $doc"
 
      - name: "context ingest"
        run: kane-cli context ingest "${{ steps.resolve.outputs.doc }}" --mode ci
 
      - name: "context extract"
        run: kane-cli context extract --mode ci
 
      - name: "context review — auto-approve all use-cases"
        run: |
          proposal=$(find .context/proposals -name 'proposal.json' 2>/dev/null | head -n1)
          if [ -n "$proposal" ]; then
            count=$(jq '.use_cases | length' "$proposal" 2>/dev/null)
            echo "Approving $count use-case(s)..."
            for i in $(seq 1 "$count"); do
              kane-cli context review --approve "uc-$i" 2>/dev/null || \
                echo "::warning::Could not approve uc-$i"
            done
          else
            echo "::warning::No proposal.json found; skipping review."
          fi
 
      - name: Debug — show stored context paths
        run: |
          echo "=== .context/ ===" && find .context 2>/dev/null || echo "(not found)"
          echo "=== .testmuai/ ===" && find .testmuai 2>/dev/null || echo "(not found)"
 
      - name: Upload context store
        uses: actions/upload-artifact@v4
        with:
          name: context-store
          include-hidden-files: true
          path: |
            .context
            .testmuai
          if-no-files-found: warn
          retention-days: 14
 
      - name: Phase 1 summary
        if: always()
        run: |
          {
            echo "## Phase 1 — Context"
            echo "| Step | Command |"
            echo "|---|---|"
            echo "| Ingest | \`kane-cli context ingest\` |"
            echo "| Extract | \`kane-cli context extract\` |"
            echo "| Review | \`kane-cli context review --approve uc-N\` |"
            echo ""
            echo "**Project ID:** \`${KANE_PROJECT_ID:-<account default>}\`"
            echo "**Folder  ID:** \`${KANE_FOLDER_ID:-<account default>}\`"
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 2 — DESIGN
  # ══════════════════════════════════════════════════════════════════════════
  design:
    name: "Phase 2 — Design: ACs to Tests"
    needs: context
    runs-on: ubuntu-latest
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: context-store
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: "📋 Phase 2 overview"
        run: |
          echo -e "\033[1;34m╔══════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;34m║          PHASE 2 — DESIGN : ACs to Tests                ║\033[0m"
          echo -e "\033[1;34m╠══════════════════════════════════════════════════════════╣\033[0m"
          echo -e "\033[0;37m  • Downloads context store produced by Phase 1            \033[0m"
          echo -e "\033[0;37m  • Re-registers AI skill (required on every fresh runner) \033[0m"
          echo -e "\033[0;37m  • Iterates each use-case: generates ACs + scenarios      \033[0m"
          echo -e "\033[0;37m  • Produces *_test.md files saved under .testmuai/tests/  \033[0m"
          echo -e "\033[0;37m  • Workspace (project/folder) set via config set          \033[0m"
          echo -e "\033[0;37m  • Uploads designed-tests artifact for downstream phases  \033[0m"
          echo -e "\033[1;34m╚══════════════════════════════════════════════════════════╝\033[0m"
 
      - name: Cache npm (avoids re-downloading kane-cli on every fresh runner)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-kane-cli
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "$KANE_PROJECT_ID" ] && args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && args+=(--folder-id  "$KANE_FOLDER_ID")
          kane-cli login "${args[@]}"
 
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID" || true
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"  || true
 
      - name: "🔍 Show active project and folder"
        run: |
          if [ -n "$KANE_PROJECT_ID" ]; then
            PROJECT_NAME=$(
              kane-cli project list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_PROJECT_ID\" or .projectId == \"$KANE_PROJECT_ID\") | .name // .projectName // .title" 2>/dev/null \
              || kane-cli project list 2>/dev/null | grep -i "$KANE_PROJECT_ID" | head -n1 \
              || echo ""
            )
            [ -n "$PROJECT_NAME" ] \
              && echo "  Project : $PROJECT_NAME  (id: $KANE_PROJECT_ID)" \
              || echo "  Project ID : $KANE_PROJECT_ID  (name not resolved)"
          else
            echo "  Project : <account default>"
          fi
          if [ -n "$KANE_FOLDER_ID" ]; then
            FOLDER_NAME=$(
              kane-cli folder list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_FOLDER_ID\" or .folderId == \"$KANE_FOLDER_ID\") | .name // .folderName // .title" 2>/dev/null \
              || kane-cli folder list 2>/dev/null | grep -i "$KANE_FOLDER_ID" | head -n1 \
              || echo ""
            )
            [ -n "$FOLDER_NAME" ] \
              && echo "  Folder  : $FOLDER_NAME  (id: $KANE_FOLDER_ID)" \
              || echo "  Folder ID : $KANE_FOLDER_ID  (name not resolved)"
          else
            echo "  Folder  : <account default>"
          fi
 
      - name: Debug — verify context data restored
        run: |
          echo "=== .context/ ===" && find .context 2>/dev/null || echo "(not found)"
          echo "=== .testmuai/ ===" && find .testmuai 2>/dev/null || echo "(not found)"
 
      - name: "design tests — Generate ACs, scenarios, *_test.md files"
        run: |
          kane-cli install skill --yes 2>/dev/null \
            || kane-cli install skill --force 2>/dev/null \
            || kane-cli install skill 2>/dev/null \
            || true
          echo "Skill install attempted."
 
          proposal=$(find .context/proposals -name 'proposal.json' 2>/dev/null | head -n1)
          [ -z "$proposal" ] && { echo "::error::No proposal.json found."; exit 1; }
 
          count=$(jq '.use_cases | length' "$proposal" 2>/dev/null)
          [ -z "$count" ] || [ "$count" -eq 0 ] && { echo "::error::No use-cases in proposal."; exit 1; }
 
          for i in $(seq 1 "$count"); do
            uc_id="uc-$i"
            echo "--- Designing: $uc_id"
            kane-cli design tests \
              --use-case "$uc_id" \
              --allow-unreviewed \
              --mode ci 2>&1 || true
          done
          exit 0
 
      - name: Upload designed tests
        uses: actions/upload-artifact@v4
        with:
          name: designed-tests
          include-hidden-files: true
          path: |
            .context
            .testmuai
          retention-days: 14
 
      - name: Phase 2 summary
        if: always()
        run: |
          test_count=$(find .testmuai/tests -name '*_test.md' 2>/dev/null | wc -l)
          {
            echo "## Phase 2 — Design"
            echo "**Tests designed:** $test_count \`*_test.md\` file(s)"
            echo "**Project ID:** \`${KANE_PROJECT_ID:-<account default>}\`"
            echo "**Folder  ID:** \`${KANE_FOLDER_ID:-<account default>}\`"
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 3 — RUN
  # ══════════════════════════════════════════════════════════════════════════
  run:
    name: "Phase 3 — Run: Author, Replay"
    needs: design
    runs-on: ubuntu-latest
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: designed-tests
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: "📋 Phase 3 overview"
        run: |
          echo -e "\033[1;32m╔══════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;32m║          PHASE 3 — RUN : Author & Replay Tests          ║\033[0m"
          echo -e "\033[1;32m╠══════════════════════════════════════════════════════════╣\033[0m"
          echo -e "\033[0;37m  • Downloads designed tests from Phase 2                  \033[0m"
          echo -e "\033[0;37m  • Runs each *_test.md via testmd run (headless + agent)  \033[0m"
          echo -e "\033[0;37m  • Exports generated automation code per test             \033[0m"
          echo -e "\033[0;37m  • Bundles all tests into one sealed run via testrun run  \033[0m"
          echo -e "\033[0;37m  • Collects evidence packs sealed by each execution       \033[0m"
          echo -e "\033[0;37m  • Uploads evidence packs + authoring links as artifact   \033[0m"
          echo -e "\033[1;32m╚══════════════════════════════════════════════════════════╝\033[0m"
 
      - name: Cache npm (avoids re-downloading kane-cli on every fresh runner)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-kane-cli
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "$KANE_PROJECT_ID" ] && args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && args+=(--folder-id  "$KANE_FOLDER_ID")
          kane-cli login "${args[@]}"
 
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID" || true
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"  || true
 
      - name: "🔍 Show active project and folder"
        run: |
          if [ -n "$KANE_PROJECT_ID" ]; then
            PROJECT_NAME=$(
              kane-cli project list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_PROJECT_ID\" or .projectId == \"$KANE_PROJECT_ID\") | .name // .projectName // .title" 2>/dev/null \
              || kane-cli project list 2>/dev/null | grep -i "$KANE_PROJECT_ID" | head -n1 \
              || echo ""
            )
            [ -n "$PROJECT_NAME" ] \
              && echo "  Project : $PROJECT_NAME  (id: $KANE_PROJECT_ID)" \
              || echo "  Project ID : $KANE_PROJECT_ID  (name not resolved)"
          else
            echo "  Project : <account default>"
          fi
          if [ -n "$KANE_FOLDER_ID" ]; then
            FOLDER_NAME=$(
              kane-cli folder list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_FOLDER_ID\" or .folderId == \"$KANE_FOLDER_ID\") | .name // .folderName // .title" 2>/dev/null \
              || kane-cli folder list 2>/dev/null | grep -i "$KANE_FOLDER_ID" | head -n1 \
              || echo ""
            )
            [ -n "$FOLDER_NAME" ] \
              && echo "  Folder  : $FOLDER_NAME  (id: $KANE_FOLDER_ID)" \
              || echo "  Folder ID : $KANE_FOLDER_ID  (name not resolved)"
          else
            echo "  Folder  : <account default>"
          fi
 
      - name: Set default start URL
        if: ${{ inputs.start_url != '' }}
        run: kane-cli config set-url "${{ inputs.start_url }}"
 
      - name: Select tests to run
        id: select
        run: |
          set -e
          mapfile -d '' -t all_tests < <(find .testmuai/tests -name '*_test.md' -print0 | sort -z)
          total=${#all_tests[@]}
          max="${{ inputs.max_tests_to_run }}"
          if [ -n "$max" ] && [ "$max" -gt 0 ] && [ "$max" -lt "$total" ]; then
            selected=("${all_tests[@]:0:$max}")
          else
            selected=("${all_tests[@]}")
          fi
          printf '%s\0' "${selected[@]}" > selected_tests.txt
          echo "count=${#selected[@]}" >> "$GITHUB_OUTPUT"
          echo "Running ${#selected[@]} of $total tests."
 
      - name: "testmd run — Author + replay each test"
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          failed=0
          : > authoring_links.tsv
 
          echo "========================================"
          echo "📤  Test Manager upload destination"
          echo "========================================"
          if [ -n "$KANE_PROJECT_ID" ]; then
            PROJ_NAME=$(kane-cli project list --json 2>/dev/null \
              | jq -r ".[] | select(.id==\"$KANE_PROJECT_ID\" or .projectId==\"$KANE_PROJECT_ID\") | .name // .projectName // .title" 2>/dev/null \
              || echo "")
            echo "   Project : ${PROJ_NAME:-<name not resolved>}  (id: $KANE_PROJECT_ID)"
          else
            echo "   Project : <account default>"
          fi
          if [ -n "$KANE_FOLDER_ID" ]; then
            FOLD_NAME=$(kane-cli folder list --json 2>/dev/null \
              | jq -r ".[] | select(.id==\"$KANE_FOLDER_ID\" or .folderId==\"$KANE_FOLDER_ID\") | .name // .folderName // .title" 2>/dev/null \
              || echo "")
            echo "   Folder  : ${FOLD_NAME:-<name not resolved>}  (id: $KANE_FOLDER_ID)"
          else
            echo "   Folder  : <account default>"
          fi
          echo "========================================"
 
          while IFS= read -r -d '' test_file; do
            echo "--- Running: $test_file"
            test_out=$(mktemp)
            kane-cli testmd run "$test_file" \
              --headless \
              --agent \
              --code-export \
              --code-language "${{ inputs.test_language }}" | tee "$test_out"
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              echo "::warning::Failed: $test_file"
              failed=$((failed+1))
            fi
            share_url=$(grep -o '"share_url":"[^"]*"' "$test_out" | tail -n1 | sed -E 's/.*:"(.*)"/\1/')
            testcase_id=$(grep -o '"testcase_id":"[^"]*"' "$test_out" | tail -n1 | sed -E 's/.*:"(.*)"/\1/')
            printf '%s\t%s\t%s\n' "$test_file" "${testcase_id:-N/A}" "${share_url:-N/A}" >> authoring_links.tsv
            rm -f "$test_out"
          done < selected_tests.txt
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed test(s) failed."
          fi
 
      - name: "testrun run — Bundle all tests into one sealed run"
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          echo "========================================"
          echo "📤  Test run upload destination"
          echo "========================================"
          if [ -n "$KANE_PROJECT_ID" ]; then
            PROJ_NAME=$(kane-cli project list --json 2>/dev/null \
              | jq -r ".[] | select(.id==\"$KANE_PROJECT_ID\" or .projectId==\"$KANE_PROJECT_ID\") | .name // .projectName // .title" 2>/dev/null \
              || echo "")
            echo "   Project : ${PROJ_NAME:-<name not resolved>}  (id: $KANE_PROJECT_ID)"
          else
            echo "   Project : <account default>"
          fi
          if [ -n "$KANE_FOLDER_ID" ]; then
            FOLD_NAME=$(kane-cli folder list --json 2>/dev/null \
              | jq -r ".[] | select(.id==\"$KANE_FOLDER_ID\" or .folderId==\"$KANE_FOLDER_ID\") | .name // .folderName // .title" 2>/dev/null \
              || echo "")
            echo "   Folder  : ${FOLD_NAME:-<name not resolved>}  (id: $KANE_FOLDER_ID)"
          else
            echo "   Folder  : <account default>"
          fi
          echo "========================================"
 
          mapfile -d '' -t test_files < selected_tests.txt
          kane-cli testrun run "${test_files[@]}" \
            --headless \
            --on-failure continue \
            --name "agentic-pipeline run ${{ github.run_id }}" | tee testrun_output.ndjson
 
      - name: Collect evidence packs
        if: always()
        id: collect
        run: |
          mkdir -p evidence-pack
          find .testmuai/evidence -name '*.evidence' -exec cp {} evidence-pack/ \; 2>/dev/null || true
          count=$(ls evidence-pack/*.evidence 2>/dev/null | wc -l || echo 0)
          echo "pack_count=$count" >> "$GITHUB_OUTPUT"
 
      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-outputs
          path: |
            evidence-pack/
            testrun_output.ndjson
            authoring_links.tsv
            .testmuai/tests/**/playwright-${{ inputs.test_language }}-code/**
          retention-days: 14
 
      - name: Phase 3 summary
        if: always()
        run: |
          {
            echo "## Phase 3 — Run"
            echo "**Tests run:** ${{ steps.select.outputs.count }}"
            echo "**Evidence packs:** ${{ steps.collect.outputs.pack_count }}"
            echo "**Project ID:** \`${KANE_PROJECT_ID:-<account default>}\`"
            echo "**Folder  ID:** \`${KANE_FOLDER_ID:-<account default>}\`"
            if [ -f authoring_links.tsv ]; then
              echo ""
              echo "| Test file | TestCase ID | Share URL |"
              echo "|---|---|---|"
              while IFS=$'\t' read -r f tc url; do
                echo "| \`$(basename "$f")\` | \`$tc\` | $url |"
              done < authoring_links.tsv
            fi
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 4 — COVER
  # ══════════════════════════════════════════════════════════════════════════
  cover:
    name: "Phase 4 — Cover: Prove and Gate"
    needs: run
    runs-on: ubuntu-latest
    if: always()
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: designed-tests
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: run-outputs
          path: run-outputs
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: "📋 Phase 4 overview"
        run: |
          echo -e "\033[1;33m╔══════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;33m║          PHASE 4 — COVER : Prove and Gate               ║\033[0m"
          echo -e "\033[1;33m╠══════════════════════════════════════════════════════════╣\033[0m"
          echo -e "\033[0;37m  • Downloads designed tests + run outputs from Phase 3    \033[0m"
          echo -e "\033[0;37m  • Runs kane-cli cover against the evidence pack          \033[0m"
          echo -e "\033[0;37m  • Measures what was proved vs what design still owes     \033[0m"
          echo -e "\033[0;37m  • Surfaces coverage gaps per acceptance criterion        \033[0m"
          echo -e "\033[0;37m  • Uploads coverage report as artifact                   \033[0m"
          echo -e "\033[1;33m╚══════════════════════════════════════════════════════════╝\033[0m"
 
      - name: Cache npm (avoids re-downloading kane-cli on every fresh runner)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-kane-cli
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "$KANE_PROJECT_ID" ] && args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && args+=(--folder-id  "$KANE_FOLDER_ID")
          kane-cli login "${args[@]}"
 
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID" || true
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"  || true
 
      - name: "🔍 Show active project and folder"
        run: |
          if [ -n "$KANE_PROJECT_ID" ]; then
            PROJECT_NAME=$(
              kane-cli project list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_PROJECT_ID\" or .projectId == \"$KANE_PROJECT_ID\") | .name // .projectName // .title" 2>/dev/null \
              || kane-cli project list 2>/dev/null | grep -i "$KANE_PROJECT_ID" | head -n1 \
              || echo ""
            )
            [ -n "$PROJECT_NAME" ] \
              && echo "  Project : $PROJECT_NAME  (id: $KANE_PROJECT_ID)" \
              || echo "  Project ID : $KANE_PROJECT_ID  (name not resolved)"
          else
            echo "  Project : <account default>"
          fi
          if [ -n "$KANE_FOLDER_ID" ]; then
            FOLDER_NAME=$(
              kane-cli folder list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_FOLDER_ID\" or .folderId == \"$KANE_FOLDER_ID\") | .name // .folderName // .title" 2>/dev/null \
              || kane-cli folder list 2>/dev/null | grep -i "$KANE_FOLDER_ID" | head -n1 \
              || echo ""
            )
            [ -n "$FOLDER_NAME" ] \
              && echo "  Folder  : $FOLDER_NAME  (id: $KANE_FOLDER_ID)" \
              || echo "  Folder ID : $KANE_FOLDER_ID  (name not resolved)"
          else
            echo "  Folder  : <account default>"
          fi
 
      - name: Copy evidence packs
        run: |
          mkdir -p .testmuai/evidence
          cp run-outputs/evidence-pack/*.evidence .testmuai/evidence/ 2>/dev/null || \
            echo "::warning::No evidence packs found."
 
      - name: "cover"
        run: |
          pack=$(ls .testmuai/evidence/*.evidence 2>/dev/null | head -n1)
          if [ -n "$pack" ]; then
            kane-cli cover --evidence "$pack" --mode ci | tee coverage_output.txt || true
          else
            echo "No evidence pack available." | tee coverage_output.txt
          fi
 
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_output.txt
          retention-days: 14
 
      - name: Phase 4 summary
        if: always()
        run: |
          {
            echo "## Phase 4 — Cover"
            [ -f coverage_output.txt ] && { echo '```'; cat coverage_output.txt; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 5 — EVIDENCE
  # ══════════════════════════════════════════════════════════════════════════
  evidence:
    name: "Phase 5 — Evidence: The Proof"
    needs: cover
    runs-on: ubuntu-latest
    if: always()
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: run-outputs
          path: run-outputs
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: "📋 Phase 5 overview"
        run: |
          echo -e "\033[1;35m╔══════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;35m║          PHASE 5 — EVIDENCE : Validate & Merge          ║\033[0m"
          echo -e "\033[1;35m╠══════════════════════════════════════════════════════════╣\033[0m"
          echo -e "\033[0;37m  • Downloads evidence packs produced in Phase 3           \033[0m"
          echo -e "\033[0;37m  • Validates each pack: checks integrity + completeness   \033[0m"
          echo -e "\033[0;37m  • Merges all packs into one stamped archive (--run-id)   \033[0m"
          echo -e "\033[0;37m  • Single pack is copied directly as the merged archive   \033[0m"
          echo -e "\033[0;37m  • Uploads merged evidence pack (30-day retention)        \033[0m"
          echo -e "\033[1;35m╚══════════════════════════════════════════════════════════╝\033[0m"
 
      - name: Cache npm (avoids re-downloading kane-cli on every fresh runner)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-kane-cli
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "$KANE_PROJECT_ID" ] && args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && args+=(--folder-id  "$KANE_FOLDER_ID")
          kane-cli login "${args[@]}"
 
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID" || true
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"  || true
 
      - name: "🔍 Show active project and folder"
        run: |
          if [ -n "$KANE_PROJECT_ID" ]; then
            PROJECT_NAME=$(
              kane-cli project list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_PROJECT_ID\" or .projectId == \"$KANE_PROJECT_ID\") | .name // .projectName // .title" 2>/dev/null \
              || kane-cli project list 2>/dev/null | grep -i "$KANE_PROJECT_ID" | head -n1 \
              || echo ""
            )
            [ -n "$PROJECT_NAME" ] \
              && echo "  Project : $PROJECT_NAME  (id: $KANE_PROJECT_ID)" \
              || echo "  Project ID : $KANE_PROJECT_ID  (name not resolved)"
          else
            echo "  Project : <account default>"
          fi
          if [ -n "$KANE_FOLDER_ID" ]; then
            FOLDER_NAME=$(
              kane-cli folder list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_FOLDER_ID\" or .folderId == \"$KANE_FOLDER_ID\") | .name // .folderName // .title" 2>/dev/null \
              || kane-cli folder list 2>/dev/null | grep -i "$KANE_FOLDER_ID" | head -n1 \
              || echo ""
            )
            [ -n "$FOLDER_NAME" ] \
              && echo "  Folder  : $FOLDER_NAME  (id: $KANE_FOLDER_ID)" \
              || echo "  Folder ID : $KANE_FOLDER_ID  (name not resolved)"
          else
            echo "  Folder  : <account default>"
          fi
 
      - name: Copy evidence packs
        run: |
          mkdir -p .testmuai/evidence
          cp run-outputs/evidence-pack/*.evidence .testmuai/evidence/ 2>/dev/null || \
            echo "::warning::No evidence packs found."
 
      - name: "evidence validate"
        id: validate
        run: |
          failed=0
          : > validation_log.txt
          for pack in .testmuai/evidence/*.evidence; do
            [ -f "$pack" ] || continue
            name=$(basename "$pack")
            kane-cli evidence validate "$pack" 2>&1 | tee -a validation_log.txt
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              echo "OK $name — valid" >> validation_log.txt
            else
              echo "FAILED $name (exit $status)" >> validation_log.txt
              failed=$((failed+1))
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed pack(s) failed validation."
          fi
 
      - name: "evidence merge"
        id: merge
        run: |
          mapfile -d '' -t packs < <(
            find .testmuai/evidence -maxdepth 1 -name '*.evidence' -print0 2>/dev/null
          )
          merged=".testmuai/evidence/merged-${{ github.run_id }}.evidence"
 
          if [ "${#packs[@]}" -gt 1 ]; then
            echo "Merging ${#packs[@]} packs..."
            kane-cli evidence merge "${packs[@]}" \
              --run-id "${{ github.run_id }}" \
              --out "$merged"
            echo "merged_packs=${#packs[@]}" >> "$GITHUB_OUTPUT"
          elif [ "${#packs[@]}" -eq 1 ]; then
            echo "Single pack — copying as merged archive."
            cp "${packs[0]}" "$merged"
            echo "merged_packs=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No evidence packs found — nothing to merge."
            echo "merged_packs=0" >> "$GITHUB_OUTPUT"
          fi
          echo "merged_path=$merged" >> "$GITHUB_OUTPUT"
 
      - name: Upload merged evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-merged
          path: .testmuai/evidence/merged-${{ github.run_id }}.evidence
          if-no-files-found: warn
          retention-days: 30
 
      - name: Phase 5 summary
        if: always()
        run: |
          {
            echo "## Phase 5 — Evidence"
            echo "| Command | Result |"
            echo "|---|---|"
            echo "| \`evidence validate\` | ${{ steps.validate.outputs.failed }} failure(s) |"
            echo "| \`evidence merge\` | ${{ steps.merge.outputs.merged_packs }} pack(s) merged |"
            [ -f validation_log.txt ] && { echo '```'; cat validation_log.txt; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
 
