name: Agentic Test Pipeline
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  One loop, from requirement to proof  (TestMu AI Assurance)             ║
# ║                                                                          ║
# ║   Phase 1 ─ CONTEXT   kane-cli context ingest/extract/review            ║
# ║   Phase 2 ─ DESIGN    kane-cli design tests                             ║
# ║   Phase 3 ─ RUN       kane-cli testmd run + testrun run                 ║
# ║   Phase 4 ─ COVER     kane-cli cover                                    ║
# ║   Phase 5 ─ EVIDENCE  kane-cli evidence validate + merge                ║
# ║   Phase 6 ─ MAINTAIN  kane-cli maintain                                 ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# NOTE ON --agent FLAG:
#   --agent outputs structured NDJSON and is only supported by RUN commands:
#     kane-cli testmd run  →  supported  ✅
#     kane-cli testrun run →  supported  ✅
#   All other assurance commands (ingest, extract, review, design, cover,
#   evidence, maintain) do NOT support --agent and will error if passed it.
#
# Required secrets:
#   KANE_USERNAME / KANE_ACCESS_KEY  — TestMu credentials
#   LT_USERNAME   / LT_ACCESS_KEY   — LambdaTest credentials
 
on:
  workflow_dispatch:
    inputs:
      requirements_doc:
        description: "Path to requirements PDF/DOCX (blank = auto-detect in repo root)"
        required: false
        default: ""
      test_language:
        description: "Language for exported automation code"
        required: false
        default: "javascript"
        type: choice
        options:
          - javascript
          - python
      max_tests_to_run:
        description: "Max tests to author and run (0 = all)"
        required: false
        default: 0
        type: number
      start_url:
        description: "Default start URL for test execution (e.g. https://freshworks.com)"
        required: false
        default: ""
      kane_project_id:
        description: "LambdaTest project ID (blank = account default)"
        required: false
        default: ""
      kane_folder_id:
        description: "LambdaTest folder ID (blank = account default)"
        required: false
        default: ""
  workflow_call:
    inputs:
      requirements_doc:
        type: string
        required: false
        default: ""
      test_language:
        type: string
        required: false
        default: "javascript"
      max_tests_to_run:
        type: number
        required: false
        default: 0
      start_url:
        type: string
        required: false
        default: ""
      kane_project_id:
        type: string
        required: false
        default: ""
      kane_folder_id:
        type: string
        required: false
        default: ""
    secrets:
      KANE_USERNAME:
        required: true
      KANE_ACCESS_KEY:
        required: true
      LT_USERNAME:
        required: true
      LT_ACCESS_KEY:
        required: true
 
jobs:
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 1 — CONTEXT
  # ══════════════════════════════════════════════════════════════════════════
  context:
    name: "Phase 1 — Context: Ingest the PRD"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Update kane-cli skill
        run: kane-cli install skill || true
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "${{ inputs.kane_project_id }}" ] && args+=(--project-id "${{ inputs.kane_project_id }}")
          [ -n "${{ inputs.kane_folder_id }}" ]  && args+=(--folder-id  "${{ inputs.kane_folder_id }}")
          kane-cli login "${args[@]}"
 
      - name: Resolve requirements document
        id: resolve
        run: |
          doc="${{ inputs.requirements_doc }}"
          if [ -z "$doc" ]; then
            doc=$(find . -maxdepth 2 \( -iname '*.pdf' -o -iname '*.docx' \) | head -n1)
          fi
          [ -z "$doc" ]   && { echo "::error::No requirements doc found."; exit 1; }
          [ ! -f "$doc" ] && { echo "::error::'$doc' not found in repo.";  exit 1; }
          echo "doc=$doc" >> "$GITHUB_OUTPUT"
          echo "Using: $doc"
 
      # context ingest: reads file into .context/ store
      - name: "context ingest — Snapshot PRD into .context/ store"
        run: kane-cli context ingest "${{ steps.resolve.outputs.doc }}" --mode ci
 
      # context extract: requires --mode ci when no TTY (CI environment)
      - name: "context extract — Extract use-cases from PRD"
        run: kane-cli context extract --mode ci
 
      # context review: needs a verdicts JSON file in CI (no TTY).
      # We auto-approve all extracted use-cases by reading IDs directly from
      # the proposal.json that kane-cli writes to .context/proposals/ — this
      # avoids --list-ids which also requires a TTY.
      - name: "context review — Auto-approve all use-cases in CI"
        run: |
          proposal=$(find .context/proposals -name 'proposal.json' | head -n1)
          if [ -n "$proposal" ]; then
            # Try array-of-objects shape first, then single-object shape
            jq '[.[] | {id: .id, verdict: "approve"}]' "$proposal" > verdicts.json 2>/dev/null \
              || jq '[{id: .id, verdict: "approve"}]' "$proposal" > verdicts.json 2>/dev/null \
              || true
            if [ -f verdicts.json ] && [ -s verdicts.json ]; then
              kane-cli context review --verdicts verdicts.json || true
            else
              echo "::warning::Could not build verdicts from proposal.json; skipping review."
            fi
          else
            echo "::warning::No proposal.json found in .context/proposals/; skipping review."
          fi
 
      - name: Debug — show where kane-cli stored context data
        run: |
          echo "=== .context/ ==="
          find .context 2>/dev/null || echo "(not found)"
          echo "=== .testmuai/ ==="
          find .testmuai 2>/dev/null || echo "(not found)"
          echo "=== any kane context files ==="
          find . -name "*.context" -o -name "use-cases.json" -o -name "*.uc" 2>/dev/null | head -20 || true
 
      - name: Upload context store
        uses: actions/upload-artifact@v4
        with:
          name: context-store
          # Use directory paths (no /**) — upload-artifact@v4 recurses into them
          # and correctly handles hidden dot-directories like .context/ and .testmuai/
          path: |
            .context
            .testmuai
          if-no-files-found: warn
          retention-days: 14
 
      - name: Phase 1 summary
        if: always()
        run: |
          {
            echo "## Phase 1 — Context: Ingest the PRD"
            echo "| Step | Command |"
            echo "|---|---|"
            echo "| Ingest | \`kane-cli context ingest\` |"
            echo "| Extract | \`kane-cli context extract\` |"
            echo "| Review | \`kane-cli context review\` |"
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 2 — DESIGN
  # ══════════════════════════════════════════════════════════════════════════
  design:
    name: "Phase 2 — Design: ACs to Tests"
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: context-store
          # Download to repo root so .context/ or .testmuai/ structure is restored correctly
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "${{ inputs.kane_project_id }}" ] && args+=(--project-id "${{ inputs.kane_project_id }}")
          [ -n "${{ inputs.kane_folder_id }}" ]  && args+=(--folder-id  "${{ inputs.kane_folder_id }}")
          kane-cli login "${args[@]}"
 
      - name: Debug — verify context data restored
        run: |
          echo "=== .context/ ===" && find .context 2>/dev/null || echo "(not found)"
          echo "=== .testmuai/ ===" && find .testmuai 2>/dev/null || echo "(not found)"
 
      # design tests: requires --mode ci when no TTY (CI environment)
      - name: "design tests — Generate ACs, scenarios, *_test.md files"
        run: kane-cli design tests --mode ci
 
      - name: Upload designed tests
        uses: actions/upload-artifact@v4
        with:
          name: designed-tests
          # Use directory paths (no /**) — same fix as Phase 1 upload
          path: |
            .context
            .testmuai
          retention-days: 14
 
      - name: Phase 2 summary
        if: always()
        run: |
          test_count=$(find .testmuai/tests -name '*_test.md' 2>/dev/null | wc -l)
          {
            echo "## Phase 2 — Design: ACs to Tests"
            echo "**Tests designed:** $test_count \`*_test.md\` file(s)"
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 3 — RUN
  # testmd run and testrun run DO support --agent (they are run commands)
  # ══════════════════════════════════════════════════════════════════════════
  run:
    name: "Phase 3 — Run: Author, Replay"
    needs: design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: designed-tests
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "${{ inputs.kane_project_id }}" ] && args+=(--project-id "${{ inputs.kane_project_id }}")
          [ -n "${{ inputs.kane_folder_id }}" ]  && args+=(--folder-id  "${{ inputs.kane_folder_id }}")
          kane-cli login "${args[@]}"
 
      - name: Set default start URL
        if: ${{ inputs.start_url != '' }}
        run: kane-cli config set-url "${{ inputs.start_url }}"
 
      - name: Select tests to run
        id: select
        run: |
          set -e
          mapfile -d '' -t all_tests < <(find .testmuai/tests -name '*_test.md' -print0 | sort -z)
          total=${#all_tests[@]}
          max="${{ inputs.max_tests_to_run }}"
          if [ -n "$max" ] && [ "$max" -gt 0 ] && [ "$max" -lt "$total" ]; then
            selected=("${all_tests[@]:0:$max}")
          else
            selected=("${all_tests[@]}")
          fi
          printf '%s\0' "${selected[@]}" > selected_tests.txt
          echo "count=${#selected[@]}" >> "$GITHUB_OUTPUT"
          echo "Running ${#selected[@]} of $total tests."
 
      # testmd run SUPPORTS --agent and --headless (it is a run command)
      - name: "testmd run — Author + replay each test"
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          set -e
          failed=0
          : > authoring_links.tsv
          while IFS= read -r -d '' test_file; do
            echo "─── Running: $test_file"
            test_out=$(mktemp)
            kane-cli testmd run "$test_file" \
              --headless \
              --agent \
              --code-export \
              --code-language "${{ inputs.test_language }}" | tee "$test_out"
            status=${PIPESTATUS[0]}
            [ "$status" -ne 0 ] && { echo "::warning::Failed: $test_file"; failed=$((failed+1)); }
            share_url=$(grep -o '"share_url":"[^"]*"' "$test_out" | tail -n1 | sed -E 's/.*:"(.*)"/\1/')
            testcase_id=$(grep -o '"testcase_id":"[^"]*"' "$test_out" | tail -n1 | sed -E 's/.*:"(.*)"/\1/')
            printf '%s\t%s\t%s\n' "$test_file" "${testcase_id:-N/A}" "${share_url:-N/A}" >> authoring_links.tsv
            rm -f "$test_out"
          done < selected_tests.txt
          [ "$failed" -gt 0 ] && echo "::warning::$failed test(s) failed."
 
      # testrun run SUPPORTS --agent and --headless (it is a run command)
      - name: "testrun run — Bundle all tests into one sealed run"
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          mapfile -d '' -t test_files < selected_tests.txt
          kane-cli testrun run "${test_files[@]}" \
            --headless \
            --agent \
            --on-failure continue \
            --name "agentic-pipeline run ${{ github.run_id }}" | tee testrun_output.ndjson
 
      - name: Collect evidence packs
        if: always()
        id: collect
        run: |
          mkdir -p evidence-pack
          find .testmuai/evidence -name '*.evidence' -exec cp {} evidence-pack/ \; 2>/dev/null || true
          count=$(ls evidence-pack/*.evidence 2>/dev/null | wc -l || echo 0)
          echo "pack_count=$count" >> "$GITHUB_OUTPUT"
 
      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-outputs
          path: |
            evidence-pack/
            testrun_output.ndjson
            authoring_links.tsv
            .testmuai/tests/**/playwright-${{ inputs.test_language }}-code/**
          retention-days: 14
 
      - name: Phase 3 summary
        if: always()
        run: |
          {
            echo "## Phase 3 — Run: Author, Replay"
            echo "**Tests run:** ${{ steps.select.outputs.count }}"
            echo "**Evidence packs:** ${{ steps.collect.outputs.pack_count }}"
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 4 — COVER
  # cover does NOT support --agent
  # ══════════════════════════════════════════════════════════════════════════
  cover:
    name: "Phase 4 — Cover: Prove and Gate"
    needs: run
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: designed-tests
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: run-outputs
          path: run-outputs
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "${{ inputs.kane_project_id }}" ] && args+=(--project-id "${{ inputs.kane_project_id }}")
          [ -n "${{ inputs.kane_folder_id }}" ]  && args+=(--folder-id  "${{ inputs.kane_folder_id }}")
          kane-cli login "${args[@]}"
 
      - name: Copy evidence packs
        run: |
          mkdir -p .testmuai/evidence
          cp run-outputs/evidence-pack/*.evidence .testmuai/evidence/ 2>/dev/null || \
            echo "::warning::No evidence packs found."
 
      # cover: add --mode ci in case it prompts without a TTY
      - name: "cover — Measure proved vs owed coverage"
        run: |
          pack=$(ls .testmuai/evidence/*.evidence 2>/dev/null | head -n1)
          if [ -n "$pack" ]; then
            kane-cli cover --evidence "$pack" --mode ci | tee coverage_output.txt || true
          else
            echo "No evidence pack available." | tee coverage_output.txt
          fi
 
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_output.txt
          retention-days: 14
 
      - name: Phase 4 summary
        if: always()
        run: |
          {
            echo "## Phase 4 — Cover: Prove and Gate"
            [ -f coverage_output.txt ] && { echo '```'; cat coverage_output.txt; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 5 — EVIDENCE
  # evidence validate and evidence merge do NOT support --agent
  # ══════════════════════════════════════════════════════════════════════════
  evidence:
    name: "Phase 5 — Evidence: The Proof"
    needs: cover
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: run-outputs
          path: run-outputs
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "${{ inputs.kane_project_id }}" ] && args+=(--project-id "${{ inputs.kane_project_id }}")
          [ -n "${{ inputs.kane_folder_id }}" ]  && args+=(--folder-id  "${{ inputs.kane_folder_id }}")
          kane-cli login "${args[@]}"
 
      - name: Copy evidence packs
        run: |
          mkdir -p .testmuai/evidence
          cp run-outputs/evidence-pack/*.evidence .testmuai/evidence/ 2>/dev/null || \
            echo "::warning::No evidence packs found."
 
      # evidence validate does NOT support --agent
      - name: "evidence validate — Check each pack's integrity"
        id: validate
        run: |
          failed=0
          : > validation_log.txt
          for pack in .testmuai/evidence/*.evidence; do
            [ -f "$pack" ] || continue
            name=$(basename "$pack")
            if kane-cli evidence validate "$pack" 2>&1 | tee -a validation_log.txt; then
              echo "✅ $name — valid" >> validation_log.txt
            else
              echo "❌ $name — FAILED" >> validation_log.txt
              failed=$((failed+1))
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          [ "$failed" -gt 0 ] && echo "::warning::$failed pack(s) failed validation."
 
      # evidence merge does NOT support --agent
      - name: "evidence merge — Combine all packs into one archive"
        id: merge
        run: |
          packs=(.testmuai/evidence/*.evidence)
          merged=".testmuai/evidence/merged-${{ github.run_id }}.evidence"
          if [ ${#packs[@]} -gt 1 ]; then
            kane-cli evidence merge "${packs[@]}" --output "$merged"
            echo "merged_packs=${#packs[@]}" >> "$GITHUB_OUTPUT"
          elif [ ${#packs[@]} -eq 1 ] && [ -f "${packs[0]}" ]; then
            cp "${packs[0]}" "$merged"
            echo "merged_packs=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No packs to merge."
            echo "merged_packs=0" >> "$GITHUB_OUTPUT"
          fi
          echo "merged_path=$merged" >> "$GITHUB_OUTPUT"
 
      - name: Upload merged evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-merged
          path: .testmuai/evidence/merged-${{ github.run_id }}.evidence
          retention-days: 30
 
      - name: Phase 5 summary
        if: always()
        run: |
          {
            echo "## Phase 5 — Evidence: The Proof"
            echo "| Command | Result |"
            echo "|---|---|"
            echo "| \`evidence validate\` | ${{ steps.validate.outputs.failed }} failure(s) |"
            echo "| \`evidence merge\` | ${{ steps.merge.outputs.merged_packs }} pack(s) merged |"
            [ -f validation_log.txt ] && { echo '```'; cat validation_log.txt; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 6 — MAINTAIN
  # maintain does NOT support --agent
  # ══════════════════════════════════════════════════════════════════════════
  maintain:
    name: "Phase 6 — Maintain: Reconcile Change"
    needs: evidence
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: designed-tests
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "${{ inputs.kane_project_id }}" ] && args+=(--project-id "${{ inputs.kane_project_id }}")
          [ -n "${{ inputs.kane_folder_id }}" ]  && args+=(--folder-id  "${{ inputs.kane_folder_id }}")
          kane-cli login "${args[@]}"
 
      # maintain: requires --mode ci when no TTY (CI environment)
      - name: "maintain — Reconcile test suite against current requirements"
        run: |
          kane-cli maintain --mode ci 2>&1 | tee maintain_output.txt || \
            echo "::warning::Maintain completed with warnings."
 
      - name: Phase 6 summary
        if: always()
        run: |
          {
            echo "## Phase 6 — Maintain: Reconcile Change"
            [ -f maintain_output.txt ] && { echo '```'; cat maintain_output.txt; echo '```'; }
            echo "---"
            echo "### ✅ Pipeline Complete — ready to restart from Phase 1"
          } >> "$GITHUB_STEP_SUMMARY"
