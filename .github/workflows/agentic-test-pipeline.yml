name: Agentic Test Pipeline
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  One loop, from requirement to proof  (TestMu AI Assurance)             ║
# ║                                                                          ║
# ║   Phase 1 ─ CONTEXT   kane-cli context ingest/extract/review            ║
# ║   Phase 2 ─ DESIGN    kane-cli design tests                             ║
# ║   Phase 3 ─ RUN       kane-cli testmd run + testrun run                 ║
# ║   Phase 4 ─ COVER     kane-cli cover                                    ║
# ║   Phase 5 ─ EVIDENCE  kane-cli evidence validate + merge                ║
# ║   Phase 6 ─ MAINTAIN  kane-cli maintain  ← ONLY runs when PRD changes  ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# FIXES IN THIS VERSION
# ─────────────────────
# FIX 1 — Folder / Project IDs not respected (new folder created each run)
#   Root cause: kane-cli login does NOT persist project/folder as the active
#   workspace for subsequent commands.  A "kane-cli config set" call is
#   required AFTER login in every job.  The values are read at runtime from
#   the workflow inputs via env-vars — nothing is hardcoded.
#
# FIX 2 — --agent flag rejected by testrun run
#   Root cause: --agent is only valid for "kane-cli testmd run".
#   It has been removed from the "testrun run" step.
#
# NOTE ON --agent FLAG:
#   --agent outputs structured NDJSON and is ONLY supported by:
#     kane-cli testmd run  →  supported  ✅
#     kane-cli testrun run →  NOT supported  ❌  (removed)
#
# Required secrets:
#   KANE_USERNAME / KANE_ACCESS_KEY  — TestMu credentials
#   LT_USERNAME   / LT_ACCESS_KEY   — LambdaTest credentials
 
on:
  workflow_dispatch:
    inputs:
      requirements_doc:
        description: "Path to requirements PDF/DOCX (blank = auto-detect in repo root)"
        required: false
        default: ""
      test_language:
        description: "Language for exported automation code"
        required: false
        default: "javascript"
        type: choice
        options:
          - javascript
          - python
      max_tests_to_run:
        description: "Max tests to author and run (0 = all)"
        required: false
        default: 0
        type: number
      start_url:
        description: "Default start URL for test execution (e.g. https://twilio.com)"
        required: false
        default: ""
      kane_project_id:
        description: "LambdaTest project ID (blank = account default)"
        required: false
        default: ""
      kane_folder_id:
        description: "LambdaTest folder ID (blank = account default)"
        required: false
        default: ""
  push:
    branches: [ main, master ]
    paths:
      - "*.pdf"
      - "*.docx"
  workflow_call:
    inputs:
      requirements_doc:
        type: string
        required: false
        default: ""
      test_language:
        type: string
        required: false
        default: "javascript"
      max_tests_to_run:
        type: number
        required: false
        default: 0
      start_url:
        type: string
        required: false
        default: ""
      kane_project_id:
        type: string
        required: false
        default: ""
      kane_folder_id:
        type: string
        required: false
        default: ""
    secrets:
      KANE_USERNAME:
        required: true
      KANE_ACCESS_KEY:
        required: true
      LT_USERNAME:
        required: true
      LT_ACCESS_KEY:
        required: true
 
# ──────────────────────────────────────────────────────────────────────────
# Reusable snippet (referenced in each job as a named step):
#   Set project and folder context — FIX 1
#   Reads project-id and folder-id from runtime env-vars (populated by
#   ${{ inputs.* }} at job level) so nothing is ever hardcoded in the YAML.
# ──────────────────────────────────────────────────────────────────────────
 
jobs:
 
  # ══════════════════════════════════════════════════════════════════════════
  # PRD CHANGE DETECTION
  # ══════════════════════════════════════════════════════════════════════════
  detect-prd-change:
    name: "Detect PRD Changes"
    runs-on: ubuntu-latest
    outputs:
      prd_changed: ${{ steps.check.outputs.prd_changed }}
      prd_file: ${{ steps.check.outputs.prd_file }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
 
      - name: Detect PRD change
        id: check
        run: |
          prd=$(find . -maxdepth 2 \( -iname '*.pdf' -o -iname '*.docx' \) | head -n1)
          echo "prd_file=${prd}" >> "$GITHUB_OUTPUT"
 
          if [ -z "$prd" ]; then
            echo "::warning::No PRD file found — treating as unchanged."
            echo "prd_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
 
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qF "${prd#./}"; then
            echo "PRD changed: $prd"
            echo "prd_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRD unchanged: $prd"
            echo "prd_changed=false" >> "$GITHUB_OUTPUT"
          fi
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 1 — CONTEXT
  # ══════════════════════════════════════════════════════════════════════════
  context:
    name: "Phase 1 — Context: Ingest the PRD"
    needs: detect-prd-change
    runs-on: ubuntu-latest
    # FIX 1: expose runtime inputs as env-vars so the config step below
    # can read them without embedding literal values in any script.
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Update kane-cli skill
        run: kane-cli install skill || true
 
      - name: Login
        run: |
          kane-cli login \
            --username "${{ secrets.KANE_USERNAME }}" \
            --access-key "${{ secrets.KANE_ACCESS_KEY }}"
 
      # FIX 1: set workspace AFTER login using runtime env-vars (not hardcoded)
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID" \
            && echo "Project ID set: $KANE_PROJECT_ID"
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"  \
            && echo "Folder  ID set: $KANE_FOLDER_ID"
 
      - name: Resolve requirements document
        id: resolve
        run: |
          doc="${{ inputs.requirements_doc }}"
          if [ -z "$doc" ]; then
            doc=$(find . -maxdepth 2 \( -iname '*.pdf' -o -iname '*.docx' \) | head -n1)
          fi
          [ -z "$doc" ]   && { echo "::error::No requirements doc found."; exit 1; }
          [ ! -f "$doc" ] && { echo "::error::'$doc' not found in repo.";  exit 1; }
          echo "doc=$doc" >> "$GITHUB_OUTPUT"
          echo "Using: $doc"
 
      - name: "context ingest — Snapshot PRD into .context/ store"
        run: kane-cli context ingest "${{ steps.resolve.outputs.doc }}" --mode ci
 
      - name: "context extract — Extract use-cases from PRD"
        run: kane-cli context extract --mode ci
 
      - name: "context review — Auto-approve all use-cases in CI"
        run: |
          proposal=$(find .context/proposals -name 'proposal.json' 2>/dev/null | head -n1)
          if [ -n "$proposal" ]; then
            count=$(jq '.use_cases | length' "$proposal" 2>/dev/null)
            echo "Approving $count use-case(s)..."
            for i in $(seq 1 "$count"); do
              echo "  Approving uc-$i"
              kane-cli context review --approve "uc-$i" 2>/dev/null || \
                echo "::warning::Could not approve uc-$i (may already be approved)"
            done
          else
            echo "::warning::No proposal.json found; skipping review."
          fi
 
      - name: Debug — show where kane-cli stored context data
        run: |
          echo "=== .context/ ==="
          find .context 2>/dev/null || echo "(not found)"
          echo "=== .testmuai/ ==="
          find .testmuai 2>/dev/null || echo "(not found)"
 
      - name: Upload context store
        uses: actions/upload-artifact@v4
        with:
          name: context-store
          include-hidden-files: true
          path: |
            .context
            .testmuai
          if-no-files-found: warn
          retention-days: 14
 
      - name: Phase 1 summary
        if: always()
        run: |
          {
            echo "## Phase 1 — Context: Ingest the PRD"
            echo "| Step | Command |"
            echo "|---|---|"
            echo "| Ingest | \`kane-cli context ingest\` |"
            echo "| Extract | \`kane-cli context extract\` |"
            echo "| Review | \`kane-cli context review --approve uc-N\` |"
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 2 — DESIGN
  # ══════════════════════════════════════════════════════════════════════════
  design:
    name: "Phase 2 — Design: ACs to Tests"
    needs: context
    runs-on: ubuntu-latest
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: context-store
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          kane-cli login \
            --username "${{ secrets.KANE_USERNAME }}" \
            --access-key "${{ secrets.KANE_ACCESS_KEY }}"
 
      # FIX 1
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID"
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"
 
      - name: Debug — verify context data restored
        run: |
          echo "=== .context/ ===" && find .context 2>/dev/null || echo "(not found)"
          echo "=== .testmuai/ ===" && find .testmuai 2>/dev/null || echo "(not found)"
 
      - name: "design tests — Generate ACs, scenarios, *_test.md files"
        run: |
          proposal=$(find .context/proposals -name 'proposal.json' 2>/dev/null | head -n1)
 
          if [ -z "$proposal" ]; then
            echo "::error::No proposal.json found under .context/proposals/."
            exit 1
          fi
 
          echo "Using proposal: $proposal"
          count=$(jq '.use_cases | length' "$proposal" 2>/dev/null)
 
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "::error::No use-cases found in proposal.json"
            exit 1
          fi
 
          echo "Designing tests for $count use-case(s): uc-1 through uc-$count"
          kane-cli install skill 2>/dev/null || true
 
          for i in $(seq 1 "$count"); do
            uc_id="uc-$i"
            echo "--- Designing tests for use-case: $uc_id"
            kane-cli design tests --use-case "$uc_id" --allow-unreviewed --mode ci 2>&1 || true
          done
 
          echo "Design loop complete."
          exit 0
 
      - name: Upload designed tests
        uses: actions/upload-artifact@v4
        with:
          name: designed-tests
          include-hidden-files: true
          path: |
            .context
            .testmuai
          retention-days: 14
 
      - name: Phase 2 summary
        if: always()
        run: |
          test_count=$(find .testmuai/tests -name '*_test.md' 2>/dev/null | wc -l)
          {
            echo "## Phase 2 — Design: ACs to Tests"
            echo "**Tests designed:** $test_count \`*_test.md\` file(s)"
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 3 — RUN
  # ══════════════════════════════════════════════════════════════════════════
  run:
    name: "Phase 3 — Run: Author, Replay"
    needs: design
    runs-on: ubuntu-latest
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: designed-tests
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          kane-cli login \
            --username "${{ secrets.KANE_USERNAME }}" \
            --access-key "${{ secrets.KANE_ACCESS_KEY }}"
 
      # FIX 1
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID"
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"
 
      - name: Set default start URL
        if: ${{ inputs.start_url != '' }}
        run: kane-cli config set-url "${{ inputs.start_url }}"
 
      - name: Select tests to run
        id: select
        run: |
          set -e
          mapfile -d '' -t all_tests < <(find .testmuai/tests -name '*_test.md' -print0 | sort -z)
          total=${#all_tests[@]}
          max="${{ inputs.max_tests_to_run }}"
          if [ -n "$max" ] && [ "$max" -gt 0 ] && [ "$max" -lt "$total" ]; then
            selected=("${all_tests[@]:0:$max}")
          else
            selected=("${all_tests[@]}")
          fi
          printf '%s\0' "${selected[@]}" > selected_tests.txt
          echo "count=${#selected[@]}" >> "$GITHUB_OUTPUT"
          echo "Running ${#selected[@]} of $total tests."
 
      - name: "testmd run — Author + replay each test"
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          set -e
          failed=0
          : > authoring_links.tsv
          while IFS= read -r -d '' test_file; do
            echo "--- Running: $test_file"
            test_out=$(mktemp)
            kane-cli testmd run "$test_file" \
              --headless \
              --agent \
              --code-export \
              --code-language "${{ inputs.test_language }}" | tee "$test_out"
            status=${PIPESTATUS[0]}
            [ "$status" -ne 0 ] && { echo "::warning::Failed: $test_file"; failed=$((failed+1)); }
            share_url=$(grep -o '"share_url":"[^"]*"' "$test_out" | tail -n1 | sed -E 's/.*:"(.*)"/\1/')
            testcase_id=$(grep -o '"testcase_id":"[^"]*"' "$test_out" | tail -n1 | sed -E 's/.*:"(.*)"/\1/')
            printf '%s\t%s\t%s\n' "$test_file" "${testcase_id:-N/A}" "${share_url:-N/A}" >> authoring_links.tsv
            rm -f "$test_out"
          done < selected_tests.txt
          [ "$failed" -gt 0 ] && echo "::warning::$failed test(s) failed."
 
      # FIX 2: --agent removed — not supported by testrun run
      - name: "testrun run — Bundle all tests into one sealed run"
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          mapfile -d '' -t test_files < selected_tests.txt
          kane-cli testrun run "${test_files[@]}" \
            --headless \
            --on-failure continue \
            --name "agentic-pipeline run ${{ github.run_id }}" | tee testrun_output.ndjson
 
      - name: Collect evidence packs
        if: always()
        id: collect
        run: |
          mkdir -p evidence-pack
          find .testmuai/evidence -name '*.evidence' -exec cp {} evidence-pack/ \; 2>/dev/null || true
          count=$(ls evidence-pack/*.evidence 2>/dev/null | wc -l || echo 0)
          echo "pack_count=$count" >> "$GITHUB_OUTPUT"
 
      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-outputs
          path: |
            evidence-pack/
            testrun_output.ndjson
            authoring_links.tsv
            .testmuai/tests/**/playwright-${{ inputs.test_language }}-code/**
          retention-days: 14
 
      - name: Phase 3 summary
        if: always()
        run: |
          {
            echo "## Phase 3 — Run: Author, Replay"
            echo "**Tests run:** ${{ steps.select.outputs.count }}"
            echo "**Evidence packs:** ${{ steps.collect.outputs.pack_count }}"
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 4 — COVER
  # ══════════════════════════════════════════════════════════════════════════
  cover:
    name: "Phase 4 — Cover: Prove and Gate"
    needs: run
    runs-on: ubuntu-latest
    if: always()
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: designed-tests
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: run-outputs
          path: run-outputs
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          kane-cli login \
            --username "${{ secrets.KANE_USERNAME }}" \
            --access-key "${{ secrets.KANE_ACCESS_KEY }}"
 
      # FIX 1
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID"
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"
 
      - name: Copy evidence packs
        run: |
          mkdir -p .testmuai/evidence
          cp run-outputs/evidence-pack/*.evidence .testmuai/evidence/ 2>/dev/null || \
            echo "::warning::No evidence packs found."
 
      - name: "cover — Measure proved vs owed coverage"
        run: |
          pack=$(ls .testmuai/evidence/*.evidence 2>/dev/null | head -n1)
          if [ -n "$pack" ]; then
            kane-cli cover --evidence "$pack" --mode ci | tee coverage_output.txt || true
          else
            echo "No evidence pack available." | tee coverage_output.txt
          fi
 
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_output.txt
          retention-days: 14
 
      - name: Phase 4 summary
        if: always()
        run: |
          {
            echo "## Phase 4 — Cover: Prove and Gate"
            [ -f coverage_output.txt ] && { echo '```'; cat coverage_output.txt; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 5 — EVIDENCE
  # ══════════════════════════════════════════════════════════════════════════
  evidence:
    name: "Phase 5 — Evidence: The Proof"
    needs: cover
    runs-on: ubuntu-latest
    if: always()
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: run-outputs
          path: run-outputs
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          kane-cli login \
            --username "${{ secrets.KANE_USERNAME }}" \
            --access-key "${{ secrets.KANE_ACCESS_KEY }}"
 
      # FIX 1
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID"
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"
 
      - name: Copy evidence packs
        run: |
          mkdir -p .testmuai/evidence
          cp run-outputs/evidence-pack/*.evidence .testmuai/evidence/ 2>/dev/null || \
            echo "::warning::No evidence packs found."
 
      - name: "evidence validate — Check each pack's integrity"
        id: validate
        run: |
          failed=0
          : > validation_log.txt
          for pack in .testmuai/evidence/*.evidence; do
            [ -f "$pack" ] || continue
            name=$(basename "$pack")
            if kane-cli evidence validate "$pack" 2>&1 | tee -a validation_log.txt; then
              echo "OK $name — valid" >> validation_log.txt
            else
              echo "FAILED $name" >> validation_log.txt
              failed=$((failed+1))
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          [ "$failed" -gt 0 ] && echo "::warning::$failed pack(s) failed validation."
 
      - name: "evidence merge — Combine all packs into one archive"
        id: merge
        run: |
          packs=(.testmuai/evidence/*.evidence)
          merged=".testmuai/evidence/merged-${{ github.run_id }}.evidence"
          if [ ${#packs[@]} -gt 1 ]; then
            kane-cli evidence merge "${packs[@]}" --output "$merged"
            echo "merged_packs=${#packs[@]}" >> "$GITHUB_OUTPUT"
          elif [ ${#packs[@]} -eq 1 ] && [ -f "${packs[0]}" ]; then
            cp "${packs[0]}" "$merged"
            echo "merged_packs=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No packs to merge."
            echo "merged_packs=0" >> "$GITHUB_OUTPUT"
          fi
          echo "merged_path=$merged" >> "$GITHUB_OUTPUT"
 
      - name: Upload merged evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-merged
          path: .testmuai/evidence/merged-${{ github.run_id }}.evidence
          retention-days: 30
 
      - name: Phase 5 summary
        if: always()
        run: |
          {
            echo "## Phase 5 — Evidence: The Proof"
            echo "| Command | Result |"
            echo "|---|---|"
            echo "| \`evidence validate\` | ${{ steps.validate.outputs.failed }} failure(s) |"
            echo "| \`evidence merge\` | ${{ steps.merge.outputs.merged_packs }} pack(s) merged |"
            [ -f validation_log.txt ] && { echo '```'; cat validation_log.txt; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 6 — MAINTAIN (only when PRD changes or manual trigger)
  # ══════════════════════════════════════════════════════════════════════════
  maintain:
    name: "Phase 6 — Maintain: Reconcile Change (PRD-gated)"
    needs: [evidence, detect-prd-change]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (
        needs.detect-prd-change.outputs.prd_changed == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: designed-tests
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          kane-cli login \
            --username "${{ secrets.KANE_USERNAME }}" \
            --access-key "${{ secrets.KANE_ACCESS_KEY }}"
 
      # FIX 1
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID"
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"
 
      - name: Show PRD change reason
        run: |
          echo "PRD changed: ${{ needs.detect-prd-change.outputs.prd_changed }}"
          echo "Triggered by: ${{ github.event_name }}"
          echo "PRD file: ${{ needs.detect-prd-change.outputs.prd_file }}"
 
      - name: "maintain — Reconcile test suite against current requirements"
        run: |
          kane-cli maintain --mode ci 2>&1 | tee maintain_output.txt || \
            echo "::warning::Maintain completed with warnings."
 
      - name: Phase 6 summary
        if: always()
        run: |
          {
            echo "## Phase 6 — Maintain: Reconcile Change"
            echo "> **Trigger:** PRD changed = \`${{ needs.detect-prd-change.outputs.prd_changed }}\`"
            echo "> **Event:** \`${{ github.event_name }}\`"
            [ -f maintain_output.txt ] && { echo '```'; cat maintain_output.txt; echo '```'; }
            echo "---"
            echo "### Pipeline Complete"
          } >> "$GITHUB_STEP_SUMMARY"
 
