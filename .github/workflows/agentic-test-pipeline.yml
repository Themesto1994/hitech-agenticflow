name: Agentic Test Pipeline
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  One loop, from requirement to proof  (TestMu AI Assurance)             ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# FIXES IN THIS VERSION
# ─────────────────────
# FIX 1 — Project / Folder ID not respected
#   Three-layer approach (most → least specific):
#     a) kane-cli login  receives --project-id / --folder-id            ← sets auth context
#     b) kane-cli config set  runs after login with the same IDs        ← sets workspace default
#     c) design tests / testrun run receive --project-id / --folder-id  ← belt-and-suspenders
#   Plus: a "Show active workspace" step prints the project name + folder
#   name from the CLI so you can confirm in the logs exactly where tests land.
#
# FIX 2 — --agent flag removed from testrun run (not supported there)
#
# Required secrets:
#   KANE_USERNAME / KANE_ACCESS_KEY  — TestMu credentials
#   LT_USERNAME   / LT_ACCESS_KEY   — LambdaTest credentials
 
on:
  workflow_dispatch:
    inputs:
      requirements_doc:
        description: "Path to requirements PDF/DOCX (blank = auto-detect in repo root)"
        required: false
        default: ""
      test_language:
        description: "Language for exported automation code"
        required: false
        default: "javascript"
        type: choice
        options:
          - javascript
          - python
      max_tests_to_run:
        description: "Max tests to author and run (0 = all)"
        required: false
        default: 0
        type: number
      start_url:
        description: "Default start URL for test execution (e.g. https://twilio.com)"
        required: false
        default: ""
      kane_project_id:
        description: "LambdaTest project ID (blank = account default)"
        required: false
        default: ""
      kane_folder_id:
        description: "LambdaTest folder ID (blank = account default)"
        required: false
        default: ""
  push:
    branches: [ main, master ]
    paths:
      - "*.pdf"
      - "*.docx"
  workflow_call:
    inputs:
      requirements_doc:
        type: string
        required: false
        default: ""
      test_language:
        type: string
        required: false
        default: "javascript"
      max_tests_to_run:
        type: number
        required: false
        default: 0
      start_url:
        type: string
        required: false
        default: ""
      kane_project_id:
        type: string
        required: false
        default: ""
      kane_folder_id:
        type: string
        required: false
        default: ""
    secrets:
      KANE_USERNAME:
        required: true
      KANE_ACCESS_KEY:
        required: true
      LT_USERNAME:
        required: true
      LT_ACCESS_KEY:
        required: true
 
jobs:
 
  # ══════════════════════════════════════════════════════════════════════════
  # PRD CHANGE DETECTION
  # ══════════════════════════════════════════════════════════════════════════
  detect-prd-change:
    name: "Detect PRD Changes"
    runs-on: ubuntu-latest
    outputs:
      prd_changed: ${{ steps.check.outputs.prd_changed }}
      prd_file: ${{ steps.check.outputs.prd_file }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
 
      - name: Detect PRD change
        id: check
        run: |
          prd=$(find . -maxdepth 2 \( -iname '*.pdf' -o -iname '*.docx' \) | head -n1)
          echo "prd_file=${prd}" >> "$GITHUB_OUTPUT"
          if [ -z "$prd" ]; then
            echo "::warning::No PRD file found — treating as unchanged."
            echo "prd_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qF "${prd#./}"; then
            echo "PRD changed: $prd"
            echo "prd_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRD unchanged: $prd"
            echo "prd_changed=false" >> "$GITHUB_OUTPUT"
          fi
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 1 — CONTEXT
  # ══════════════════════════════════════════════════════════════════════════
  context:
    name: "Phase 1 — Context: Ingest the PRD"
    needs: detect-prd-change
    runs-on: ubuntu-latest
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Update kane-cli skill
        run: kane-cli install skill || true
 
      # ── Layer a: login with IDs ───────────────────────────────────────────
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "$KANE_PROJECT_ID" ] && args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && args+=(--folder-id  "$KANE_FOLDER_ID")
          kane-cli login "${args[@]}"
 
      # ── Layer b: config set after login ──────────────────────────────────
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID" || true
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"  || true
 
      # ── Diagnostic: resolve IDs → names ──────────────────────────────────
      - name: "🔍 Show active project and folder"
        run: |
          echo "=== Resolving project and folder names ==="
 
          # --- Project name ---
          if [ -n "$KANE_PROJECT_ID" ]; then
            PROJECT_NAME=$(
              kane-cli project list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_PROJECT_ID\" or .projectId == \"$KANE_PROJECT_ID\") | .name // .projectName // .title" 2>/dev/null \
              || kane-cli project list 2>/dev/null | grep -i "$KANE_PROJECT_ID" | head -n1 \
              || echo ""
            )
            if [ -n "$PROJECT_NAME" ]; then
              echo "  Project : $PROJECT_NAME  (id: $KANE_PROJECT_ID)"
            else
              echo "  Project ID : $KANE_PROJECT_ID  (name not resolved — check kane-cli project list)"
            fi
          else
            echo "  Project : <account default> (no ID provided)"
          fi
 
          # --- Folder name ---
          if [ -n "$KANE_FOLDER_ID" ]; then
            FOLDER_NAME=$(
              kane-cli folder list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_FOLDER_ID\" or .folderId == \"$KANE_FOLDER_ID\") | .name // .folderName // .title" 2>/dev/null \
              || kane-cli folder list 2>/dev/null | grep -i "$KANE_FOLDER_ID" | head -n1 \
              || echo ""
            )
            if [ -n "$FOLDER_NAME" ]; then
              echo "  Folder  : $FOLDER_NAME  (id: $KANE_FOLDER_ID)"
            else
              echo "  Folder ID : $KANE_FOLDER_ID  (name not resolved — check kane-cli folder list)"
            fi
          else
            echo "  Folder  : <account default> (no ID provided)"
          fi
 
      - name: Resolve requirements document
        id: resolve
        run: |
          doc="${{ inputs.requirements_doc }}"
          if [ -z "$doc" ]; then
            doc=$(find . -maxdepth 2 \( -iname '*.pdf' -o -iname '*.docx' \) | head -n1)
          fi
          [ -z "$doc" ]   && { echo "::error::No requirements doc found."; exit 1; }
          [ ! -f "$doc" ] && { echo "::error::'$doc' not found in repo.";  exit 1; }
          echo "doc=$doc" >> "$GITHUB_OUTPUT"
          echo "Using: $doc"
 
      - name: "context ingest"
        run: kane-cli context ingest "${{ steps.resolve.outputs.doc }}" --mode ci
 
      - name: "context extract"
        run: kane-cli context extract --mode ci
 
      - name: "context review — auto-approve all use-cases"
        run: |
          proposal=$(find .context/proposals -name 'proposal.json' 2>/dev/null | head -n1)
          if [ -n "$proposal" ]; then
            count=$(jq '.use_cases | length' "$proposal" 2>/dev/null)
            echo "Approving $count use-case(s)..."
            for i in $(seq 1 "$count"); do
              kane-cli context review --approve "uc-$i" 2>/dev/null || \
                echo "::warning::Could not approve uc-$i"
            done
          else
            echo "::warning::No proposal.json found; skipping review."
          fi
 
      - name: Debug — show stored context paths
        run: |
          echo "=== .context/ ===" && find .context 2>/dev/null || echo "(not found)"
          echo "=== .testmuai/ ===" && find .testmuai 2>/dev/null || echo "(not found)"
 
      - name: Upload context store
        uses: actions/upload-artifact@v4
        with:
          name: context-store
          include-hidden-files: true
          path: |
            .context
            .testmuai
          if-no-files-found: warn
          retention-days: 14
 
      - name: Phase 1 summary
        if: always()
        run: |
          {
            echo "## Phase 1 — Context"
            echo "| Step | Command |"
            echo "|---|---|"
            echo "| Ingest | \`kane-cli context ingest\` |"
            echo "| Extract | \`kane-cli context extract\` |"
            echo "| Review | \`kane-cli context review --approve uc-N\` |"
            echo ""
            echo "**Project ID:** \`${KANE_PROJECT_ID:-<account default>}\`"
            echo "**Folder  ID:** \`${KANE_FOLDER_ID:-<account default>}\`"
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 2 — DESIGN
  # ══════════════════════════════════════════════════════════════════════════
  design:
    name: "Phase 2 — Design: ACs to Tests"
    needs: context
    runs-on: ubuntu-latest
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: context-store
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "$KANE_PROJECT_ID" ] && args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && args+=(--folder-id  "$KANE_FOLDER_ID")
          kane-cli login "${args[@]}"
 
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID" || true
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"  || true
 
      # ── Diagnostic ───────────────────────────────────────────────────────
      - name: "🔍 Show active project and folder"
        run: |
          if [ -n "$KANE_PROJECT_ID" ]; then
            PROJECT_NAME=$(
              kane-cli project list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_PROJECT_ID\" or .projectId == \"$KANE_PROJECT_ID\") | .name // .projectName // .title" 2>/dev/null \
              || kane-cli project list 2>/dev/null | grep -i "$KANE_PROJECT_ID" | head -n1 \
              || echo ""
            )
            [ -n "$PROJECT_NAME" ] \
              && echo "  Project : $PROJECT_NAME  (id: $KANE_PROJECT_ID)" \
              || echo "  Project ID : $KANE_PROJECT_ID  (name not resolved)"
          else
            echo "  Project : <account default>"
          fi
          if [ -n "$KANE_FOLDER_ID" ]; then
            FOLDER_NAME=$(
              kane-cli folder list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_FOLDER_ID\" or .folderId == \"$KANE_FOLDER_ID\") | .name // .folderName // .title" 2>/dev/null \
              || kane-cli folder list 2>/dev/null | grep -i "$KANE_FOLDER_ID" | head -n1 \
              || echo ""
            )
            [ -n "$FOLDER_NAME" ] \
              && echo "  Folder  : $FOLDER_NAME  (id: $KANE_FOLDER_ID)" \
              || echo "  Folder ID : $KANE_FOLDER_ID  (name not resolved)"
          else
            echo "  Folder  : <account default>"
          fi
 
      - name: Debug — verify context data restored
        run: |
          echo "=== .context/ ===" && find .context 2>/dev/null || echo "(not found)"
          echo "=== .testmuai/ ===" && find .testmuai 2>/dev/null || echo "(not found)"
 
      # ── Layer c: pass IDs directly to design tests ────────────────────────
      - name: "design tests — Generate ACs, scenarios, *_test.md files"
        run: |
          proposal=$(find .context/proposals -name 'proposal.json' 2>/dev/null | head -n1)
          [ -z "$proposal" ] && { echo "::error::No proposal.json found."; exit 1; }
 
          count=$(jq '.use_cases | length' "$proposal" 2>/dev/null)
          [ -z "$count" ] || [ "$count" -eq 0 ] && { echo "::error::No use-cases in proposal."; exit 1; }
 
          # Build optional project/folder args
          proj_args=()
          [ -n "$KANE_PROJECT_ID" ] && proj_args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && proj_args+=(--folder-id  "$KANE_FOLDER_ID")
 
          for i in $(seq 1 "$count"); do
            uc_id="uc-$i"
            echo "--- Designing: $uc_id"
            kane-cli design tests \
              --use-case "$uc_id" \
              --allow-unreviewed \
              --mode ci \
              "${proj_args[@]}" 2>&1 || true
          done
          exit 0
 
      - name: Upload designed tests
        uses: actions/upload-artifact@v4
        with:
          name: designed-tests
          include-hidden-files: true
          path: |
            .context
            .testmuai
          retention-days: 14
 
      - name: Phase 2 summary
        if: always()
        run: |
          test_count=$(find .testmuai/tests -name '*_test.md' 2>/dev/null | wc -l)
          {
            echo "## Phase 2 — Design"
            echo "**Tests designed:** $test_count \`*_test.md\` file(s)"
            echo "**Project ID:** \`${KANE_PROJECT_ID:-<account default>}\`"
            echo "**Folder  ID:** \`${KANE_FOLDER_ID:-<account default>}\`"
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 3 — RUN
  # ══════════════════════════════════════════════════════════════════════════
  run:
    name: "Phase 3 — Run: Author, Replay"
    needs: design
    runs-on: ubuntu-latest
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: designed-tests
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "$KANE_PROJECT_ID" ] && args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && args+=(--folder-id  "$KANE_FOLDER_ID")
          kane-cli login "${args[@]}"
 
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID" || true
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"  || true
 
      # ── Diagnostic ───────────────────────────────────────────────────────
      - name: "🔍 Show active project and folder"
        run: |
          if [ -n "$KANE_PROJECT_ID" ]; then
            PROJECT_NAME=$(
              kane-cli project list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_PROJECT_ID\" or .projectId == \"$KANE_PROJECT_ID\") | .name // .projectName // .title" 2>/dev/null \
              || kane-cli project list 2>/dev/null | grep -i "$KANE_PROJECT_ID" | head -n1 \
              || echo ""
            )
            [ -n "$PROJECT_NAME" ] \
              && echo "  Project : $PROJECT_NAME  (id: $KANE_PROJECT_ID)" \
              || echo "  Project ID : $KANE_PROJECT_ID  (name not resolved)"
          else
            echo "  Project : <account default>"
          fi
          if [ -n "$KANE_FOLDER_ID" ]; then
            FOLDER_NAME=$(
              kane-cli folder list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_FOLDER_ID\" or .folderId == \"$KANE_FOLDER_ID\") | .name // .folderName // .title" 2>/dev/null \
              || kane-cli folder list 2>/dev/null | grep -i "$KANE_FOLDER_ID" | head -n1 \
              || echo ""
            )
            [ -n "$FOLDER_NAME" ] \
              && echo "  Folder  : $FOLDER_NAME  (id: $KANE_FOLDER_ID)" \
              || echo "  Folder ID : $KANE_FOLDER_ID  (name not resolved)"
          else
            echo "  Folder  : <account default>"
          fi
 
      - name: Set default start URL
        if: ${{ inputs.start_url != '' }}
        run: kane-cli config set-url "${{ inputs.start_url }}"
 
      - name: Select tests to run
        id: select
        run: |
          set -e
          mapfile -d '' -t all_tests < <(find .testmuai/tests -name '*_test.md' -print0 | sort -z)
          total=${#all_tests[@]}
          max="${{ inputs.max_tests_to_run }}"
          if [ -n "$max" ] && [ "$max" -gt 0 ] && [ "$max" -lt "$total" ]; then
            selected=("${all_tests[@]:0:$max}")
          else
            selected=("${all_tests[@]}")
          fi
          printf '%s\0' "${selected[@]}" > selected_tests.txt
          echo "count=${#selected[@]}" >> "$GITHUB_OUTPUT"
          echo "Running ${#selected[@]} of $total tests."
 
      - name: "testmd run — Author + replay each test"
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          set -e
          failed=0
          : > authoring_links.tsv
 
          proj_args=()
          [ -n "$KANE_PROJECT_ID" ] && proj_args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && proj_args+=(--folder-id  "$KANE_FOLDER_ID")
 
          while IFS= read -r -d '' test_file; do
            echo "--- Running: $test_file"
            test_out=$(mktemp)
            kane-cli testmd run "$test_file" \
              --headless \
              --agent \
              --code-export \
              --code-language "${{ inputs.test_language }}" \
              "${proj_args[@]}" | tee "$test_out"
            status=${PIPESTATUS[0]}
            [ "$status" -ne 0 ] && { echo "::warning::Failed: $test_file"; failed=$((failed+1)); }
            share_url=$(grep -o '"share_url":"[^"]*"' "$test_out" | tail -n1 | sed -E 's/.*:"(.*)"/\1/')
            testcase_id=$(grep -o '"testcase_id":"[^"]*"' "$test_out" | tail -n1 | sed -E 's/.*:"(.*)"/\1/')
            printf '%s\t%s\t%s\n' "$test_file" "${testcase_id:-N/A}" "${share_url:-N/A}" >> authoring_links.tsv
            rm -f "$test_out"
          done < selected_tests.txt
          [ "$failed" -gt 0 ] && echo "::warning::$failed test(s) failed."
 
      # FIX 2: --agent removed; project/folder args passed directly (layer c)
      - name: "testrun run — Bundle all tests into one sealed run"
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          proj_args=()
          [ -n "$KANE_PROJECT_ID" ] && proj_args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && proj_args+=(--folder-id  "$KANE_FOLDER_ID")
 
          mapfile -d '' -t test_files < selected_tests.txt
          kane-cli testrun run "${test_files[@]}" \
            --headless \
            --on-failure continue \
            --name "agentic-pipeline run ${{ github.run_id }}" \
            "${proj_args[@]}" | tee testrun_output.ndjson
 
      - name: Collect evidence packs
        if: always()
        id: collect
        run: |
          mkdir -p evidence-pack
          find .testmuai/evidence -name '*.evidence' -exec cp {} evidence-pack/ \; 2>/dev/null || true
          count=$(ls evidence-pack/*.evidence 2>/dev/null | wc -l || echo 0)
          echo "pack_count=$count" >> "$GITHUB_OUTPUT"
 
      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-outputs
          path: |
            evidence-pack/
            testrun_output.ndjson
            authoring_links.tsv
            .testmuai/tests/**/playwright-${{ inputs.test_language }}-code/**
          retention-days: 14
 
      - name: Phase 3 summary
        if: always()
        run: |
          {
            echo "## Phase 3 — Run"
            echo "**Tests run:** ${{ steps.select.outputs.count }}"
            echo "**Evidence packs:** ${{ steps.collect.outputs.pack_count }}"
            echo "**Project ID:** \`${KANE_PROJECT_ID:-<account default>}\`"
            echo "**Folder  ID:** \`${KANE_FOLDER_ID:-<account default>}\`"
            if [ -f authoring_links.tsv ]; then
              echo ""
              echo "| Test file | TestCase ID | Share URL |"
              echo "|---|---|---|"
              while IFS=$'\t' read -r f tc url; do
                echo "| \`$(basename "$f")\` | \`$tc\` | $url |"
              done < authoring_links.tsv
            fi
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 4 — COVER
  # ══════════════════════════════════════════════════════════════════════════
  cover:
    name: "Phase 4 — Cover: Prove and Gate"
    needs: run
    runs-on: ubuntu-latest
    if: always()
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: designed-tests
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: run-outputs
          path: run-outputs
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "$KANE_PROJECT_ID" ] && args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && args+=(--folder-id  "$KANE_FOLDER_ID")
          kane-cli login "${args[@]}"
 
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID" || true
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"  || true
 
      - name: "🔍 Show active project and folder"
        run: |
          if [ -n "$KANE_PROJECT_ID" ]; then
            PROJECT_NAME=$(
              kane-cli project list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_PROJECT_ID\" or .projectId == \"$KANE_PROJECT_ID\") | .name // .projectName // .title" 2>/dev/null \
              || kane-cli project list 2>/dev/null | grep -i "$KANE_PROJECT_ID" | head -n1 \
              || echo ""
            )
            [ -n "$PROJECT_NAME" ] \
              && echo "  Project : $PROJECT_NAME  (id: $KANE_PROJECT_ID)" \
              || echo "  Project ID : $KANE_PROJECT_ID  (name not resolved)"
          else
            echo "  Project : <account default>"
          fi
          if [ -n "$KANE_FOLDER_ID" ]; then
            FOLDER_NAME=$(
              kane-cli folder list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_FOLDER_ID\" or .folderId == \"$KANE_FOLDER_ID\") | .name // .folderName // .title" 2>/dev/null \
              || kane-cli folder list 2>/dev/null | grep -i "$KANE_FOLDER_ID" | head -n1 \
              || echo ""
            )
            [ -n "$FOLDER_NAME" ] \
              && echo "  Folder  : $FOLDER_NAME  (id: $KANE_FOLDER_ID)" \
              || echo "  Folder ID : $KANE_FOLDER_ID  (name not resolved)"
          else
            echo "  Folder  : <account default>"
          fi
 
      - name: Copy evidence packs
        run: |
          mkdir -p .testmuai/evidence
          cp run-outputs/evidence-pack/*.evidence .testmuai/evidence/ 2>/dev/null || \
            echo "::warning::No evidence packs found."
 
      - name: "cover"
        run: |
          pack=$(ls .testmuai/evidence/*.evidence 2>/dev/null | head -n1)
          if [ -n "$pack" ]; then
            kane-cli cover --evidence "$pack" --mode ci | tee coverage_output.txt || true
          else
            echo "No evidence pack available." | tee coverage_output.txt
          fi
 
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_output.txt
          retention-days: 14
 
      - name: Phase 4 summary
        if: always()
        run: |
          {
            echo "## Phase 4 — Cover"
            [ -f coverage_output.txt ] && { echo '```'; cat coverage_output.txt; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 5 — EVIDENCE
  # ══════════════════════════════════════════════════════════════════════════
  evidence:
    name: "Phase 5 — Evidence: The Proof"
    needs: cover
    runs-on: ubuntu-latest
    if: always()
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: run-outputs
          path: run-outputs
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "$KANE_PROJECT_ID" ] && args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && args+=(--folder-id  "$KANE_FOLDER_ID")
          kane-cli login "${args[@]}"
 
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID" || true
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"  || true
 
      - name: "🔍 Show active project and folder"
        run: |
          if [ -n "$KANE_PROJECT_ID" ]; then
            PROJECT_NAME=$(
              kane-cli project list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_PROJECT_ID\" or .projectId == \"$KANE_PROJECT_ID\") | .name // .projectName // .title" 2>/dev/null \
              || kane-cli project list 2>/dev/null | grep -i "$KANE_PROJECT_ID" | head -n1 \
              || echo ""
            )
            [ -n "$PROJECT_NAME" ] \
              && echo "  Project : $PROJECT_NAME  (id: $KANE_PROJECT_ID)" \
              || echo "  Project ID : $KANE_PROJECT_ID  (name not resolved)"
          else
            echo "  Project : <account default>"
          fi
          if [ -n "$KANE_FOLDER_ID" ]; then
            FOLDER_NAME=$(
              kane-cli folder list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_FOLDER_ID\" or .folderId == \"$KANE_FOLDER_ID\") | .name // .folderName // .title" 2>/dev/null \
              || kane-cli folder list 2>/dev/null | grep -i "$KANE_FOLDER_ID" | head -n1 \
              || echo ""
            )
            [ -n "$FOLDER_NAME" ] \
              && echo "  Folder  : $FOLDER_NAME  (id: $KANE_FOLDER_ID)" \
              || echo "  Folder ID : $KANE_FOLDER_ID  (name not resolved)"
          else
            echo "  Folder  : <account default>"
          fi
 
      - name: Copy evidence packs
        run: |
          mkdir -p .testmuai/evidence
          cp run-outputs/evidence-pack/*.evidence .testmuai/evidence/ 2>/dev/null || \
            echo "::warning::No evidence packs found."
 
      - name: "evidence validate"
        id: validate
        run: |
          failed=0
          : > validation_log.txt
          for pack in .testmuai/evidence/*.evidence; do
            [ -f "$pack" ] || continue
            name=$(basename "$pack")
            # Pipe through tee but capture kane-cli's own exit code via PIPESTATUS
            kane-cli evidence validate "$pack" 2>&1 | tee -a validation_log.txt
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              echo "OK $name — valid" >> validation_log.txt
            else
              echo "FAILED $name (exit $status)" >> validation_log.txt
              failed=$((failed+1))
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          # Use if/fi — avoids bash -e treating a false [ ] as a fatal error
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed pack(s) failed validation."
          fi
 
      - name: "evidence merge"
        id: merge
        run: |
          # Use find + mapfile so the array is truly empty when no files exist.
          # A bare glob like (.testmuai/evidence/*.evidence) expands to the
          # literal pattern string when nothing matches, giving a false count of 1.
          mapfile -d '' -t packs < <(
            find .testmuai/evidence -maxdepth 1 -name '*.evidence' -print0 2>/dev/null
          )
          merged=".testmuai/evidence/merged-${{ github.run_id }}.evidence"
 
          if [ "${#packs[@]}" -gt 1 ]; then
            echo "Merging ${#packs[@]} packs..."
            kane-cli evidence merge "${packs[@]}" --output "$merged"
            echo "merged_packs=${#packs[@]}" >> "$GITHUB_OUTPUT"
          elif [ "${#packs[@]}" -eq 1 ]; then
            echo "Single pack — copying as merged archive."
            cp "${packs[0]}" "$merged"
            echo "merged_packs=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No evidence packs found — nothing to merge."
            echo "merged_packs=0" >> "$GITHUB_OUTPUT"
          fi
          echo "merged_path=$merged" >> "$GITHUB_OUTPUT"
 
      - name: Upload merged evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-merged
          path: .testmuai/evidence/merged-${{ github.run_id }}.evidence
          if-no-files-found: warn
          retention-days: 30
 
      - name: Phase 5 summary
        if: always()
        run: |
          {
            echo "## Phase 5 — Evidence"
            echo "| Command | Result |"
            echo "|---|---|"
            echo "| \`evidence validate\` | ${{ steps.validate.outputs.failed }} failure(s) |"
            echo "| \`evidence merge\` | ${{ steps.merge.outputs.merged_packs }} pack(s) merged |"
            [ -f validation_log.txt ] && { echo '```'; cat validation_log.txt; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
 
  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 6 — MAINTAIN
  # ══════════════════════════════════════════════════════════════════════════
  maintain:
    name: "Phase 6 — Maintain: Reconcile Change (PRD-gated)"
    needs: [evidence, detect-prd-change]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (
        needs.detect-prd-change.outputs.prd_changed == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    env:
      KANE_PROJECT_ID: ${{ inputs.kane_project_id }}
      KANE_FOLDER_ID:  ${{ inputs.kane_folder_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: designed-tests
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli@latest
 
      - name: Login
        run: |
          set -e
          args=(--username "${{ secrets.KANE_USERNAME }}" --access-key "${{ secrets.KANE_ACCESS_KEY }}")
          [ -n "$KANE_PROJECT_ID" ] && args+=(--project-id "$KANE_PROJECT_ID")
          [ -n "$KANE_FOLDER_ID"  ] && args+=(--folder-id  "$KANE_FOLDER_ID")
          kane-cli login "${args[@]}"
 
      - name: Set project and folder context
        run: |
          [ -n "$KANE_PROJECT_ID" ] && kane-cli config set project-id "$KANE_PROJECT_ID" || true
          [ -n "$KANE_FOLDER_ID"  ] && kane-cli config set folder-id  "$KANE_FOLDER_ID"  || true
 
      - name: "🔍 Show active project and folder"
        run: |
          if [ -n "$KANE_PROJECT_ID" ]; then
            PROJECT_NAME=$(
              kane-cli project list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_PROJECT_ID\" or .projectId == \"$KANE_PROJECT_ID\") | .name // .projectName // .title" 2>/dev/null \
              || kane-cli project list 2>/dev/null | grep -i "$KANE_PROJECT_ID" | head -n1 \
              || echo ""
            )
            [ -n "$PROJECT_NAME" ] \
              && echo "  Project : $PROJECT_NAME  (id: $KANE_PROJECT_ID)" \
              || echo "  Project ID : $KANE_PROJECT_ID  (name not resolved)"
          else
            echo "  Project : <account default>"
          fi
          if [ -n "$KANE_FOLDER_ID" ]; then
            FOLDER_NAME=$(
              kane-cli folder list --json 2>/dev/null \
                | jq -r ".[] | select(.id == \"$KANE_FOLDER_ID\" or .folderId == \"$KANE_FOLDER_ID\") | .name // .folderName // .title" 2>/dev/null \
              || kane-cli folder list 2>/dev/null | grep -i "$KANE_FOLDER_ID" | head -n1 \
              || echo ""
            )
            [ -n "$FOLDER_NAME" ] \
              && echo "  Folder  : $FOLDER_NAME  (id: $KANE_FOLDER_ID)" \
              || echo "  Folder ID : $KANE_FOLDER_ID  (name not resolved)"
          else
            echo "  Folder  : <account default>"
          fi
 
      - name: Show PRD change reason
        run: |
          echo "PRD changed: ${{ needs.detect-prd-change.outputs.prd_changed }}"
          echo "Triggered by: ${{ github.event_name }}"
          echo "PRD file: ${{ needs.detect-prd-change.outputs.prd_file }}"
 
      - name: "maintain"
        run: |
          kane-cli maintain --mode ci 2>&1 | tee maintain_output.txt || \
            echo "::warning::Maintain completed with warnings."
 
      - name: Phase 6 summary
        if: always()
        run: |
          {
            echo "## Phase 6 — Maintain"
            echo "> **Trigger:** PRD changed = \`${{ needs.detect-prd-change.outputs.prd_changed }}\`"
            echo "> **Event:** \`${{ github.event_name }}\`"
            [ -f maintain_output.txt ] && { echo '```'; cat maintain_output.txt; echo '```'; }
            echo "---"
            echo "### Pipeline Complete"
          } >> "$GITHUB_STEP_SUMMARY"
